<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7gy/lpif7zzRtLee5dVJ2jnz0Qd8gqk8qULl" crossorigin="anonymous">
</head>
<body>
    <!-- Example of handling multiple resource types in display.html -->
    <div class="container mt-5">
        {% for resource_type, resources in results.items() %}
            <h2>{{ resource_type }}</h2>
            <ul>
                {% for resource in resources %}
                    <li>{{ resource.id }}</li>
                {% endfor %}
            </ul>
        {% endfor %}
        <a href="/" class="btn btn-link">Back to Home</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
